function parseCSV(t){const rows=[];let r=[],f="",q=false;t=t.replace(/^\uFEFF/,"");for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==","){r.push(f);f=""}else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;r.push(f);rows.push(r);r=[];f=""}else f+=c}if(f!==""||r.length){r.push(f);rows.push(r)}return rows.filter(r=>r.some(x=>x.trim()!==""))}
function buildCustom(text){const rows=parseCSV(text),errs=[],items=[],seen=new Set();let s=0;if(rows.length&&/^name$/i.test((rows[0][0]||"").trim()))s=1;
 for(let i=s;i<rows.length;i++){const r=rows[i],ln=i+1,name=(r[0]||"").trim().slice(0,40),raw=(r[1]||"").trim(),pt=Number(raw),em=(r[2]||"").trim().slice(0,8);
  if(!name){errs.push("Row "+ln+": name is empty");continue}if(raw===""||!Number.isFinite(pt)||pt<0||pt>100){errs.push("Row "+ln+" ("+name+"): points must be a number from 0 to 100");continue}
  if(seen.has(name.toLowerCase())){errs.push("Row "+ln+": duplicate name “"+name+"”");continue}seen.add(name.toLowerCase());items.push({name,points:Math.round(pt*10)/10,emoji:esc(em)})}
 if(items.length<3)errs.push("Need at least 3 valid items (found "+items.length+")");if(items.length>200)errs.push("Maximum is 200 items");return{items:items.slice(0,200),errs}}

<p><b class="gold">Goal:</b> use your coins to win countries at auction. Each country has hidden points for the chosen topic. The player whose countries score best wins.</p>
<h3 class="gold">Setup options</h3>
<p><b>Topic:</b> decides which hidden points each country has: Military Power, Economy, Cinema Influence, Technology, Sports, or Tourism &amp; Culture. The same country can be strong in one topic and weak in another. The points here are sample game estimates, not official rankings.</p>
<p><b>Players:</b> one name per line, 2 to 20, all unique.</p>
<p><b>Countries in auction:</b> how many mystery countries are auctioned one by one. More countries means a longer game (15 takes roughly 10 to 15 minutes).</p>
<p><b>Starting coins:</b> each player’s budget. A country’s price comes out of it.</p>
<p><b>Base price:</b> the lowest allowed opening bid. With base 4, nobody can open below 4.</p>
<p><b>Min increment:</b> how much each bid must beat the last one. Base 4 and increment 1 goes 4, 5, 6, 7. Increment 5 goes 4, 9, 14. During bidding you can either press <b>Quick bid</b> (current bid + increment) or type your own amount and press <b>Bid</b>. Your amount must be a whole number, at least the minimum, and no more than your coins.</p>
<p><b>Timer (sec):</b> how long each auction runs. Every valid bid resets the timer to the full time, so nobody can win with a last-second bid. Use <b>Pause timer</b> to freeze the clock while players discuss: bidding stays open while paused, and each bid resets the frozen time. Press <b>Resume timer</b> to start the clock again.</p>
<p><b>Purchase limit:</b> the most countries one player can buy. <b>0 means unlimited.</b> This is separate from the scoring rule.</p>
<p><b>Final scoring:</b> how the winner is decided.</p>
<ul><li><b>Top 3 / 5 / 10:</b> only your best 3, 5 or 10 countries add up. If you own fewer, all of them count.</li><li><b>All:</b> every country you own counts, so quantity matters.</li><li><b>Average:</b> total points divided by countries owned, so quality matters and weak extras hurt.</li></ul>
<p><b>Wrap-up auction:</b> countries nobody bid on come back for one cheaper second auction.</p>
<p><b>Wrap-up base price:</b> the opening price in that round (at least 1), so players with few coins can still win something.</p>
<p><b>Free-pick round:</b> countries still unsold are claimed for 0 coins, even with an empty wallet. <b>Drag</b> a country card onto the player who takes it (on a phone you can also tap the country, then tap the player). <b>Turns</b> mode: only the highlighted player can take, order is random, you can pass, and the round ends when countries run out or everyone passes in a row. <b>Anyone can take</b> mode: any player can be given a country at any time, and you press <b>End round</b> when you’re done. Purchase limits still apply.</p>
<h3 class="gold">How a game flows</h3>
<ol><li>A mystery country appears showing only its base price. Press <b>Reveal</b> to show it.</li><li>Players bid with their buttons until the timer ends.</li><li>The highest bidder wins and pays their bid. Points stay hidden for the whole game; the board during play only shows who owns which country and how many coins are left.</li><li>After all countries, unsold ones go to the wrap-up, then to free picks.</li><li>The results screen shows every player’s points for the first time, and ranks them. Ties go to coins left, then your best single country.</li></ol>
<h3 class="gold">Suggested settings</h3>
<ul><li><b>Standard (3 players):</b> 15 countries, 50 coins, base 4, increment 1, 20 seconds, no limit, Top 5. This is the default.</li><li><b>Faster:</b> 10 countries, timer 10.</li><li><b>More tactical:</b> purchase limit 5 with Top 5.</li><li><b>Rewards bargains:</b> Average scoring.</li></ul></div>`;

 if(S.phase==="RESULTS"){const r=Server.rank(),w=r[0],all=S.players.flatMap(p=>p.owned.map(o=>({...o,by:p.name}))),buy=[...all].filter(o=>o.type==="BOUGHT").sort((a,b)=>b.c.score/b.price-a.c.score/a.price)[0];

  <h3>Remaining ${NP()}</h3><div class="grid">${f.left.map(c=>`<div class="card cc ${selC===c.id?"lead":""}" data-c="${c.id}" style="text-align:center;touch-action:none;cursor:grab;user-select:none"><div class="flag" style="font-size:44px">${c.flag}</div>${esc(c.name)}</div>`).join("")}</div>`}
 const a=S.a,n=S.i+1,N=S.queue.length,left=Math.max(0,(a.paused?a.left:a.end-Date.now())/1000);
 let h=`<div class="row sp"><h2>${S.phase==="WRAP"?"♻️ Wrap-Up Auction":"🔨 Main Auction"}</h2><span class="mu">${S.cfg.custom?"🛠️ "+esc(S.cfg.custom.name):TOP[S.cfg.topic].ic+" "+TOP[S.cfg.topic].nm} · ${NS()} ${n}/${N}</span></div>`;

 {const S0=Server.state,key=S0.phase+"|"+S0.i+"|"+(S0.a&&S0.a.started?1:0)+"|"+screen;if(key===lastKey)$.querySelectorAll(".pop").forEach(e=>e.classList.remove("pop"));lastKey=key}
